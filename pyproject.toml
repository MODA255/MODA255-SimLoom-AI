[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simloom-ai"
version = "0.1.0"
description = "AI agent runtime for operating engineering software and validating workflow results"
readme = "README.md"
authors = [{ name = "MODA255" }]
keywords = ["engineering", "CAD", "simulation", "CATIA", "Ansys", "Adams", "VI-grade", "MCP", "AI"]
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "httpx>=0.25",
  "ezdxf>=1.4.5,<2",
  "matplotlib>=3.8,<4",
  "Pillow>=10,<13",
  "pypdf>=5,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
brep = [
  "cadquery-ocp>=7.7",
]
windows = [
  "pywin32>=306; sys_platform == 'win32'",
]
desktop = [
  "pywebview>=5,<7",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"
engineering-agent = "engineering_agent.cli:main"
simloom-ai = "engineering_agent.desktop:main"

[project.urls]
Homepage = "https://github.com/MODA255/MODA255-SimLoom-AI"
Repository = "https://github.com/MODA255/MODA255-SimLoom-AI"
Issues = "https://github.com/MODA255/MODA255-SimLoom-AI/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineering_agent = ["static/*.html", "static/*.css", "static/*.js"]
