[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-test-orchestrator"
version = "0.1.0"
description = "MatrixGen daily regression test orchestrator"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2",
  "httpx>=0.25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
brep = [
  "cadquery-ocp>=7.7",
]
windows = [
  "pywin32>=306; sys_platform == 'win32'",
]
desktop = [
  "pywebview>=5,<7",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"
engineering-agent = "engineering_agent.cli:main"
simloom-ai = "engineering_agent.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
engineering_agent = ["static/*.html", "static/*.css", "static/*.js"]
