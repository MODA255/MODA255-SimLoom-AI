name: engineering-agent

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: python -m engineering_agent.cli --help
      - run: python -m compileall -q src
      - run: pytest -q
      - name: offline smoke
        run: |
          python -m engineering_agent.cli --project-dir "$RUNNER_TEMP/simloom-smoke" offline-run

  cad-portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Run portability tests
        run: python scripts/ci/run_portability.py
      - name: Publish portability failure details
        if: failure()
        run: python scripts/ci/report_pytest_failures.py "$RUNNER_TEMP/cad-portability.xml"
      - name: Upload portability test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-portability-${{ matrix.os }}
          path: ${{ runner.temp }}/cad-portability.xml
          if-no-files-found: warn

  cad-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e ".[dev]"
      - run: npm install --prefix "$RUNNER_TEMP/cad-browser-tools" playwright@1.65.0
      - run: "$RUNNER_TEMP/cad-browser-tools/node_modules/.bin/playwright install --with-deps chromium"
      - run: node tests/browser/cad_editor.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cad-browser-tools/node_modules
          SIMLOOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/cad-browser-evidence
      - run: node tests/browser/cad_plotting.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cad-browser-tools/node_modules
          SIMLOOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/cad-browser-evidence
      - run: node tests/browser/cad_viewer.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cad-browser-tools/node_modules
          SIMLOOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/cad-browser-evidence
      - run: node tests/browser/cad_history.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cad-browser-tools/node_modules
          SIMLOOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/cad-browser-evidence
      - run: node tests/browser/project_versions.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cad-browser-tools/node_modules
          SIMLOOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/cad-browser-evidence
      - run: node tests/browser/software_jobs.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/cad-browser-tools/node_modules
          SIMLOOM_BROWSER_ARTIFACTS: ${{ runner.temp }}/cad-browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-browser-evidence
          path: ${{ runner.temp }}/cad-browser-evidence
